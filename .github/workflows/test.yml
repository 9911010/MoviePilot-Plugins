name: plugin-tests
on: [push, pull_request]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install Pillow PyYAML
      - run: python -m unittest discover -s tests/v3/collectioncoversync -v
      - run: python -m unittest discover -s tests/v3/mediaimagerepair -v
      - run: python -m compileall -q plugins.v3
